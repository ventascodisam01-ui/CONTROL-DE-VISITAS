<h2 id="titulo">Registrar visita</h2>
<p class="sub" id="subtitulo">Cargando punto...</p>

<input id="vendedor" placeholder="Su nombre">
<input id="foto" type="file" accept="image/*" capture="environment">
<button type="button" onclick="quitarFoto()" style="background:transparent;color:#B23A2E;border:1px solid #B23A2E;">Quitar foto</button>
<button onclick="enviar()">Confirmar visita</button>
<div id="msg"></div>
<div id="pendientes"></div>

<script>
/* =================== CONFIGURACIÓN =================== */
/* Reemplace este valor por la URL de su aplicación web de Apps Script
   (la que termina en /exec). Edítelo una sola vez tras el primer despliegue. */
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbwbt4wfPKF4eqTxzn-BTAPgbpX_fLWP6CFdOynDcTgfdaog8ZpZcob4FGxDLcbtTa9p/exec";
/* ======================================================= */

var params = new URLSearchParams(window.location.search);
var idPunto = params.get('id') || '';
var token = params.get('t') || '';

document.getElementById('subtitulo').textContent = idPunto ? ("Punto: " + idPunto) : "Código QR sin identificar";

var vendedorGuardado = localStorage.getItem('cv_vendedor');
if (vendedorGuardado) document.getElementById('vendedor').value = vendedorGuardado;

var lat = '', lon = '';
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(function (p) { lat = p.coords.latitude; lon = p.coords.longitude; });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

function quitarFoto() { document.getElementById('foto').value = ''; }

function toBase64(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(r.result); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function colaPendientes() { return JSON.parse(localStorage.getItem('cv_pendientes') || '[]'); }
function guardarCola(cola) { localStorage.setItem('cv_pendientes', JSON.stringify(cola)); mostrarPendientes(); }
function mostrarPendientes() {
  var cola = colaPendientes();
  document.getElementById('pendientes').textContent = cola.length
    ? (cola.length + " visita(s) esperando señal para sincronizarse.")
    : "";
}

function enviarAlBackend(payload) {
  return fetch(BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).then(function (r) { return r.json(); });
}

function enviar() {
  var vendedor = document.getElementById('vendedor').value;
  localStorage.setItem('cv_vendedor', vendedor);
  var fotoInput = document.getElementById('foto').files[0];
  var msg = document.getElementById('msg');
  msg.style.color = '#1E2A32';
  msg.textContent = 'Enviando...';

  (fotoInput ? toBase64(fotoInput) : Promise.resolve('')).then(function (b64) {
    var payload = { id: idPunto, t: token, vendedor: vendedor, lat: lat, lon: lon, foto: b64 };
    enviarAlBackend(payload).then(function (d) {
      msg.style.color = d.ok ? '#2e7d32' : '#c62828';
      msg.textContent = d.mensaje;
    }).catch(function () {
      var cola = colaPendientes();
      cola.push(payload);
      guardarCola(cola);
      msg.style.color = '#B23A2E';
      msg.textContent = 'Sin señal — guardado en el celular, se enviará automáticamente.';
    });
  });
}

function sincronizarPendientes() {
  var cola = colaPendientes();
  if (cola.length === 0) return;
  var restante = [];
  var procesos = cola.map(function (payload) {
    return enviarAlBackend(payload).catch(function () { restante.push(payload); });
  });
  Promise.all(procesos).then(function () { guardarCola(restante); });
}

window.addEventListener('online', sincronizarPendientes);
window.addEventListener('load', function () { mostrarPendientes(); sincronizarPendientes(); });
</script>
</body>
</html>
